<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка письма</title><body><h1>Локальная проверка email</h1><p>Письмо обрабатывается в памяти на этом компьютере. Внешние API, DNS и HTTP-запросы не используются.</p>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="file" name="email_file" accept=".eml" required><button type="submit">Анализировать</button></form><p><a href="/vulnerabilities">Что проверяется</a></p><form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Выйти</button></form></body></html>
